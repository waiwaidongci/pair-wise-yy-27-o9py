<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.merged{border-left:5px solid #2e7d32}.conflict{border-left:5px solid #c62828}.undecided{border-left:5px solid #ef6c00}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section><section><h2>异文多层修订（按版本各带层号，互不拦截）</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="该版本当前层号 expected_layer"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文(层0)</button><button onclick="revise()">按当前层号提交新层</button><button onclick="snapshot()">查看快照</button><pre id="extra"></pre></section><section><h2>负责人合并裁决</h2><input id="mergewits" placeholder="选定版本 ID，逗号分隔，如 1,2"><textarea id="mergetext" placeholder="合并稿文本"></textarea><button onclick="merge()">生成/重新确认合并稿</button> <button onclick="lock()">锁定段落</button></section><section><h2>校勘稿导出（合并稿 / 仍冲突 / 未裁决）</h2><input id="exportwork" type="number" placeholder="作品 ID"><button onclick="collation()">导出</button><div id="export"></div></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_layer:+revision.value})}function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_layer:+revision.value},'#extra')}function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}function merge(){const ids=mergewits.value.split(',').map(s=>+s).filter(Boolean);post('/api/passages/'+passage.value+'/merge',{witness_ids:ids,merged_text:mergetext.value,user_id:+user.value},'#extra')}
function block(title,cls,ps,render){return '<h3 class="'+cls+'">'+title+'（'+ps.length+'）</h3>'+ps.map(p=>'<div class="'+cls+'" style="padding:8px;margin:6px 0">'+render(p)+'</div>').join('')}
function cand(p){return (p.candidates||[]).map(c=>'【'+c.siglum+' 层'+c.layer+'】'+c.proposed_text+'（'+c.reason+'）').join('<br>')}
async function collation(){const d=await(await fetch('/api/works/'+exportwork.value+'/collation?user_id='+user.value)).json();if(!d.work){document.querySelector('#export').innerHTML='<pre>'+JSON.stringify(d,null,2)+'</pre>';return}
let html='<p>缺口统计：'+d.gap_count+'</p>'
html+=block('已确认合并稿','merged',d.merged,p=>p.label+'（'+(p.locked?'已锁定':'未锁定')+'）<br><b>'+p.merged_text+'</b><br><small>选定：'+p.selected.map(s=>s.siglum+' 层'+s.layer).join('、')+'</small>')
html+=block('仍冲突的版本（旧合并稿已失效，旧校记不再导出）','conflict',d.conflicts,p=>p.label+'<br>'+p.stale_reason+'<br>'+cand(p))
html+=block('未裁决段落','undecided',d.undecided,p=>p.label+'（'+(p.locked?'已锁定':'未锁定')+'）<br>'+cand(p))
document.querySelector('#export').innerHTML=html}state()</script></html>
